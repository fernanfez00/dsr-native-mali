name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Debug APK for arm64-v8a phones. Download it from the run's "Artifacts" section.
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners ship the Android SDK at $ANDROID_HOME; just add what we need.
      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      # The repo has no Gradle wrapper jar; use a pinned Gradle instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK signature
        run: $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs android/app/build/outputs/apk/debug/*.apk

      - name: List native libraries in the APK
        run: unzip -l android/app/build/outputs/apk/debug/*.apk | grep '\.so$'

      - uses: actions/upload-artifact@v4
        with:
          name: dsr-native-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Function addresses of this build's native library, in the job log (the profiler logs dsr+0x... offsets).
      - name: Symbol table
        run: |
          NM=$(ls $ANDROID_HOME/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm | head -1)
          LIB=$(ls android/app/build/intermediates/cxx/*/*/obj/arm64-v8a/libdsr.so | head -1)
          echo "DSR-SYMBOLS-BEGIN $LIB"
          $NM -n -C --defined-only "$LIB" | grep -iE ' [tw] ' | sed 's/^0*//'
          echo "DSR-SYMBOLS-END"

      # Unstripped native library: symbolizes the profiler's dsr+0x... addresses.
      - uses: actions/upload-artifact@v4
        with:
          name: dsr-native-symbols-${{ github.sha }}
          path: android/app/build/intermediates/cxx/*/*/obj/arm64-v8a/libdsr.so
          if-no-files-found: warn
          retention-days: 30

  # Loader/HLE tests on x86-64 and on a real arm64 machine. The arm64 job also runs the
  # assembly transition code (x18 handling, thunks, GuestCall, setjmp/longjmp).
  host-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure -V

      - name: Test the .nsp / .xci installer
        run: |
          pip install --quiet cryptography || sudo apt-get install -y python3-cryptography
          tests/switch_package/run.sh
